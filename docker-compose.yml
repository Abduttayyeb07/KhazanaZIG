# All services communicate over the internal zig-net network.
# No database or cache ports are exposed to the host.

networks:
  zig-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Must match the password inside DATABASE_URL in .env. Changing it after the
      # volume exists does nothing — the credential lives in the volume.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: zig_treasury
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zig-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - zig-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  core-engine:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # NODE_ENV only. DATABASE_URL is deliberately NOT set here: an `environment:`
      # entry outranks `env_file:`, so hardcoding it silently discarded the password
      # set in .env and pinned every deployment to postgres:postgres.
      NODE_ENV: production
    ports:
      # Host side bound to loopback — the reverse proxy terminates TLS and forwards
      # here. The container itself must listen on 0.0.0.0 (API_HOST), or Docker's
      # forwarder cannot reach it.
      - "127.0.0.1:3001:3001"
    networks:
      - zig-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
