# All services communicate over the internal zig-net network.
# No database or cache ports are exposed to the host.

networks:
  zig-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Must match the password inside DATABASE_URL in .env. Changing it after the
      # volume exists does nothing — the credential lives in the volume.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: zig_treasury
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zig-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - zig-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  core-engine:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # NODE_ENV only. DATABASE_URL is deliberately NOT set here: an `environment:`
      # entry outranks `env_file:`, so hardcoding it silently discarded the password
      # set in .env and pinned every deployment to postgres:postgres.
      NODE_ENV: production
    ports:
      # Published on all interfaces so the API is reachable at http://<host>:3101.
      # Put a TLS proxy in front before this carries anything but paper trading —
      # the operator token and session cookie cross this connection in the clear.
      - "3101:3001"
    networks:
      - zig-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runner
      args:
        # Empty = same-origin relative URLs. The proxy serves the dashboard and
        # forwards /api and /ws to core-engine, so the browser needs no absolute
        # host. Override only if the API lives on a different domain.
        NEXT_PUBLIC_API_URL: "${PUBLIC_API_URL:-}"
        NEXT_PUBLIC_WS_URL: "${PUBLIC_WS_URL:-}"
    restart: unless-stopped
    ports:
      - "3100:3000"
    networks:
      - zig-net
    depends_on:
      - core-engine

volumes:
  postgres_data:
  redis_data:
