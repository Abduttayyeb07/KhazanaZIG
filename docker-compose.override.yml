# Local development overrides — auto-merged by `docker compose up`.
# Binds Postgres and Redis to localhost ONLY (127.0.0.1) so the host-run
# backend (npm run dev) can reach them during development.
# This file is NOT used in production deploys (use -f docker-compose.yml explicitly).

# Port note: 5432 is reserved by Windows, and 15432 is taken by another project's
# Postgres on this machine (edversity-pg). Colliding there is worse than it sounds —
# the client connects successfully to the WRONG database and reports a missing
# schema rather than a port conflict. 15442 is ours.
services:
  postgres:
    ports:
      - "127.0.0.1:15442:5432"
